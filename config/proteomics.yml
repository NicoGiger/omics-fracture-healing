# Serum proteomics analysis configuration.
# Paths are kept separately in config/paths.yml (git-ignored).

input:
  format: wide_protein
  delimiter: "\t"

columns:
  protein_id: protein_id
  sample_id: sample_id
  animal_id: animal_id
  condition: condition
  timepoint: timepoint
  batch: null

preprocessing:
  # "linear" applies log2 transformation; "log2" leaves the scale unchanged.
  intensity_scale: linear
  zero_or_negative_to_na: true

  # Do not normalize blindly: serum proteomics exports may already be normalized.
  # Supported values: none, robscale.
  normalization: none

model:
  # auto: use limma for independent samples and a random-intercept lmer when
  # multiple samples from the same animal are detected.
  # Other supported values: limma, lmer.
  mode: auto

  # "auto" constructs condition * timepoint when both columns are configured.
  fixed_effects: auto

  limma:
    trend: true
    robust: true

  # Named prolfqua/limma contrast expressions. Keep empty until the design and
  # coefficient names have been inspected on the real metadata.
  contrasts: {}
